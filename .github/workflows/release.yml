# GitHub Release and GHCR images of one VERSION.
#
#   1. Bump VERSION on main (X.Y.Z, or X.Y.Z-rc.1 for a prerelease).
#   2. Push the tag v<VERSION> on that commit, or run this workflow on main
#      (Actions > Release > Run workflow), which creates the tag when missing.
#
# The run tests the tree (ci.yml), builds the tarballs with make_release.py,
# publishes the release with the console and agent tarballs, sdr-doa-docker
# and SHA256SUMS, and pushes the images built from those same tarballs:
#   ghcr.io/<owner>/sdr-doa-ground-console  linux/amd64, linux/arm64
#   ghcr.io/<owner>/sdr-doa-rdf-sdr-agent   linux/amd64, linux/arm64, linux/arm/v7
# tagged <V>, <MAJOR>.<MINOR>, <MAJOR> and latest (a prerelease only <V>).
# The repository is public, so assets and (once the packages are public)
# images can be fetched without a GitHub login.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build release tarballs
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      create_tag: ${{ steps.tag.outputs.create_tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      console_image: ${{ steps.images.outputs.console_image }}
      console_tags: ${{ steps.images.outputs.console_tags }}
      agent_image: ${{ steps.images.outputs.agent_image }}
      agent_tags: ${{ steps.images.outputs.agent_tags }}
      labels: ${{ steps.images.outputs.labels }}
    steps:
      - name: Check out with the BrowSDR submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Every branch and tag: the checks need origin/main and existing tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            vendor/BrowSDR/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the tag against VERSION and main
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: python3 tools/release_check.py tag --event "$EVENT_NAME" --ref "$GIT_REF"

      - name: Image names, tags and labels
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.tag.outputs.version }}
          REVISION: ${{ steps.tag.outputs.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 tools/release_check.py images --owner "$OWNER" --version "$VERSION" \
            --revision "$REVISION" --source "$SOURCE"

      - name: Build the release (npm ci, build:all, tarballs with wheels)
        run: python3 tools/make_release.py --with-wheels

      - name: Check the release assets
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python3 tools/release_check.py assets --dir dist/release --version "$VERSION"
          (cd dist/release && sha256sum -c SHA256SUMS)

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Verify SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Create the tag on main
        if: needs.build.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          if ! gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null; then
            echo "::error::Could not create the tag $TAG on $SHA. Push it yourself (git tag $TAG $SHA && git push origin $TAG); that push runs this workflow again."
            exit 1
          fi
          echo "Created tag $TAG on $SHA"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          assets=(
            "release/sdr-doa-ground-console-${VERSION}-linux.tar.gz"
            "release/sdr-doa-rdf-sdr-agent-${VERSION}.tar.gz"
            "release/sdr-doa-docker"
            "release/SHA256SUMS"
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A rerun of this version: replace the assets, keep the notes.
            gh release upload "$TAG" "${assets[@]}" --clobber
            echo "Updated the assets of release $TAG"
          else
            flags=(--verify-tag --generate-notes --title "SDR-DoA Ground Console $VERSION")
            if [ "$PRERELEASE" = true ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${assets[@]}" "${flags[@]}"
          fi

  images:
    name: GHCR images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Unpack the console and agent releases
        id: unpack
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          mkdir unpacked
          console="sdr-doa-ground-console-${VERSION}-linux"
          agent="sdr-doa-rdf-sdr-agent-${VERSION}"
          tar -xzf "release/${console}.tar.gz" -C unpacked
          tar -xzf "release/${agent}.tar.gz" -C unpacked
          # The images are built from exactly what the tarballs hold.
          (cd "unpacked/${console}" && sha256sum --check --quiet MANIFEST.sha256)
          (cd "unpacked/${agent}" && sha256sum --check --quiet MANIFEST.sha256)
          echo "console_dir=unpacked/${console}" >> "$GITHUB_OUTPUT"
          echo "agent_dir=unpacked/${agent}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64, arm/v7)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the console image (Dockerfile.release)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.unpack.outputs.console_dir }}
          file: ${{ steps.unpack.outputs.console_dir }}/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.build.outputs.console_tags }}
          labels: ${{ needs.build.outputs.labels }}

      - name: Build and push the agent image (Dockerfile.agent)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.unpack.outputs.agent_dir }}
          file: ${{ steps.unpack.outputs.agent_dir }}/Dockerfile.agent
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ needs.build.outputs.agent_tags }}
          labels: ${{ needs.build.outputs.labels }}

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

      - name: Check an anonymous pull
        env:
          CONSOLE_REF: ${{ needs.build.outputs.console_image }}:${{ needs.build.outputs.version }}
          AGENT_REF: ${{ needs.build.outputs.agent_image }}:${{ needs.build.outputs.version }}
        run: |
          # sdr-doa-docker pulls without a login, so the packages must be public.
          # GHCR creates a new package as private; its visibility is set once.
          for ref in "$CONSOLE_REF" "$AGENT_REF"; do
            if docker manifest inspect "$ref" > /dev/null 2>&1; then
              echo "Anonymous pull works: $ref"
            else
              package="${ref#ghcr.io/*/}"
              package="${package%%:*}"
              echo "::warning::$ref cannot be pulled without a login. Set the package visibility to Public once: GitHub > your profile > Packages > ${package} > Package settings > Change visibility."
            fi
          done
