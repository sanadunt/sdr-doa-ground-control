# LAN staging broker for the edge agent (mosquitto 2.0 or newer).
# Staging only, not a production security configuration. The listener needs
# TLS and a password because the agent refuses a non-loopback broker without
# them. Before starting the broker, create:
#   - the password file:  mosquitto_passwd -c /etc/mosquitto/sdr-doa-lan.passwd sdr-doa-agent
#     (add a separate account for each Ground Console monitor)
#   - the ACL file from deploy/mosquitto-sdr-doa-lan.acl.example
#   - a CA and a broker certificate whose subjectAltName contains
#     IP:192.168.100.173; the agent verifies the broker against that CA.
#     Python 3.13 and newer verify strictly: the CA needs
#     basicConstraints=critical,CA:TRUE and keyUsage=keyCertSign.
per_listener_settings true
listener 18885 192.168.100.173
allow_anonymous false
password_file /etc/mosquitto/sdr-doa-lan.passwd
acl_file /etc/mosquitto/sdr-doa-lan.acl
cafile /etc/mosquitto/certs/sdr-doa-lan-ca.crt
certfile /etc/mosquitto/certs/sdr-doa-lan-broker.crt
keyfile /etc/mosquitto/certs/sdr-doa-lan-broker.key
persistence false
log_type error
log_type warning
log_type notice
connection_messages true
